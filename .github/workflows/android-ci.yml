name: Android CI (analyze, tests, debug APK)

# Runs without signing secrets: static analysis, Dart tests, native SNI parser
# tests under sanitizers and a debug APK that can be installed for testing.

on:
  push:
    branches: [main, principal]
  pull_request:
    branches: [main, principal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sni-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run SNI parser tests (ASan + UBSan)
        run: |
          cc -std=c11 -D_DEFAULT_SOURCE -Wall -Wextra -Werror \
             -fsanitize=address,undefined -fno-sanitize-recover=all -g \
             -I android/app/src/main/cpp \
             android/app/src/main/cpp/aura_sni_firewall.c \
             test/native/test_aura_sni_firewall.c \
             -o "$RUNNER_TEMP/aura_sni_test" -lpthread
          "$RUNNER_TEMP/aura_sni_test"

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Dart tests with coverage
        run: flutter test --coverage
      - name: Coverage summary
        run: |
          total=$(grep -c '^DA:' coverage/lcov.info || true)
          hit=$(grep '^DA:' coverage/lcov.info | grep -vc ',0$' || true)
          if [ "${total:-0}" -gt 0 ]; then
            pct=$(awk -v h="$hit" -v t="$total" 'BEGIN{printf "%.1f", 100*h/t}')
            echo "Dart line coverage: ${pct}% (${hit}/${total})" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: aura-dart-coverage
          path: coverage/lcov.info
          retention-days: 14
